[project]
name = "drishti"
version = "0.1.0"
description = "Drishti: agentic chart-reading, prediction and paper-trading system (PAPER ONLY)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyotp>=2.9",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "scikit-learn>=1.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drishti*"]
